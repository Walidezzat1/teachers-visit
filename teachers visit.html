                  <button onClick={() => setActiveTab('teachers')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 ${activeTab === 'teachers' ? 'bg-emerald-700 text-white font-bold shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                    <Icons.Users /> سجل المعلمين
                  </button>
                  <button onClick={() => setActiveTab('analytics')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 ${activeTab === 'analytics' ? 'bg-emerald-700 text-white font-bold shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}>
                    <Icons.Chart /> تحليل النتائج
                  </button>
                </nav>

                <div className="p-4 text-xs text-emerald-400 text-center border-t border-emerald-800">
                  الإصدار الرقمي 2025/2026
                </div>
              </aside>

              {/* Main Content */}
              <main className="flex-1 overflow-y-auto bg-slate-50 relative">
                {activeTab === 'dashboard' && <DashboardView teachers={teachers} />}
                {activeTab === 'visit' && <VisitFormView teachers={teachers} />}
                {activeTab === 'teachers' && <TeachersView teachers={teachers} setTeachers={setTeachers} />}
                {activeTab === 'analytics' && <AnalyticsView />}
              </main>

            </div>
          );
        }

        // ==========================================
        // Dashboard View (الرئيسية)
        // ==========================================
        function DashboardView({ teachers }) {
          return (
            <div className="p-8 animate-fade-in">
              <h2 className="text-3xl font-bold text-gray-800 mb-8 border-b pb-4">مؤشرات الأداء للمنطقة</h2>
              
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-emerald-100 flex items-center justify-between">
                  <div>
                    <p className="text-sm text-gray-500 font-bold mb-1">إجمالي المدارس</p>
                    <p className="text-4xl font-extrabold text-emerald-700">17</p>
                  </div>
                  <div className="w-14 h-14 bg-emerald-100 rounded-full flex items-center justify-center text-2xl">🏫</div>
                </div>
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-blue-100 flex items-center justify-between">
                  <div>
                    <p className="text-sm text-gray-500 font-bold mb-1">إجمالي المعلمين</p>
                    <p className="text-4xl font-extrabold text-blue-700">{teachers.length}</p>
                  </div>
                  <div className="w-14 h-14 bg-blue-100 rounded-full flex items-center justify-center text-2xl">👨‍🏫</div>
                </div>
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-orange-100 flex items-center justify-between">
                  <div>
                    <p className="text-sm text-gray-500 font-bold mb-1">الزيارات المنجزة</p>
                    <p className="text-4xl font-extrabold text-orange-700">45</p>
                  </div>
                  <div className="w-14 h-14 bg-orange-100 rounded-full flex items-center justify-center text-2xl">📋</div>
                </div>
              </div>

              <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                <h3 className="text-xl font-bold text-gray-800 mb-4">خطة العمل والتوجيهات (محاكاة)</h3>
                <div className="space-y-4">
                  <div className="p-4 bg-red-50 border-r-4 border-red-500 rounded-lg">
                    <h4 className="font-bold text-red-800">متابعة المدارس ذات التحصيل المتدني</h4>
                    <p className="text-sm text-red-600 mt-1">تجهيز خطة علاجية لرفع مستوى التحصيل في وحدة "الكهرباء والمغناطيسية".</p>
                  </div>
                  <div className="p-4 bg-emerald-50 border-r-4 border-emerald-500 rounded-lg">
                    <h4 className="font-bold text-emerald-800">ورشة المعلمين الجدد</h4>
                    <p className="text-sm text-emerald-600 mt-1">إعداد المادة العلمية لورشة "استراتيجيات تدريس الفيزياء الحديثة".</p>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        // ==========================================
        // Visit Form & WhatsApp Sender (التقرير والواتساب)
        // ==========================================
        function VisitFormView({ teachers }) {
          const [formData, setFormData] = useState({
            teacherName: '',
            civilId: '',
            school: '',
            date: new Date().toISOString().split('T')[0],
            lessonTitle: '',
            grade: '',
            evaluation: 'امتياز',
            strengths: '',
            recommendations: '',
          });

          const [phoneNumbers, setPhoneNumbers] = useState({
            principal: '',
            hod: '',
            senior: '' 
          });

          const [searchQuery, setSearchQuery] = useState('');
          const [showDropdown, setShowDropdown] = useState(false);
          const [isGenerating, setIsGenerating] = useState(false);

          // تصفية المعلمين
          const filteredTeachers = teachers.filter(t => 
            t.name.includes(searchQuery) || t.civilId.includes(searchQuery)
          );

          // اختيار المعلم
          const handleSelectTeacher = (teacher) => {
            setFormData({
              ...formData,
              teacherName: teacher.name,
              civilId: teacher.civilId,
              school: teacher.school
            });
            setSearchQuery(teacher.name);
            setShowDropdown(false);
          };

          // --- دالة تحميل الـ PDF وفتح الواتساب (للحاسوب) ---
          const downloadAndOpenWa = (pdfBlob, fileName, phoneNumber, messageText) => {
             // تنزيل الملف
             const url = URL.createObjectURL(pdfBlob);
             const a = document.createElement('a');
             a.href = url;
             a.download = fileName;
             document.body.appendChild(a);
             a.click();
             document.body.removeChild(a);
             URL.revokeObjectURL(url);
             
             // فتح واتساب ويب
             let cleanedNumber = phoneNumber.replace(/\D/g, '');
             if (cleanedNumber.length === 8) {
                 cleanedNumber = '965' + cleanedNumber; 
             }
             const encodedMessage = encodeURIComponent(messageText);
             const whatsappUrl = `https://wa.me/${cleanedNumber}?text=${encodedMessage}`;
             setTimeout(() => { window.open(whatsappUrl, '_blank'); }, 500);
          };

          // --- الدالة الرئيسية لتوليد الـ PDF والمشاركة المباشرة ---
          const sendWhatsAppAndPDF = async (phoneNumber, recipientRole) => {
            if (!formData.teacherName) {
                alert("الرجاء اختيار المعلم وإكمال التقرير أولاً.");
                return;
            }
            if (!phoneNumber && !navigator.canShare) {
                // إذا كنا سنستخدم رابط wa.me في الكمبيوتر، نحتاج الرقم
                alert(`الرجاء إدخال رقم هاتف ${recipientRole}`);
                return;
            }

            setIsGenerating(true);

            // 1. استنساخ قالب الـ PDF المخفي لتصويره
            const element = document.getElementById('pdf-hidden-template');
            const clone = element.cloneNode(true);
            clone.style.display = 'block'; 
            clone.style.position = 'absolute';
            clone.style.left = '-9999px';
            document.body.appendChild(clone);

            const fileName = `زيارة_${formData.teacherName.replace(/\s+/g, '_')}_${formData.date}.pdf`;

            const opt = {
              margin:       0.5,
              filename:     fileName,
              image:        { type: 'jpeg', quality: 0.98 },
              html2canvas:  { scale: 2, useCORS: true },
              jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };

            try {
                // 2. توليد الـ PDF على هيئة Blob بدلاً من تحميله مباشرة
                const pdfWorker = html2pdf().set(opt).from(clone);
                const pdfBlob = await pdfWorker.output('blob');
                
                // تحويل الـ Blob إلى File ليكون قابلاً للمشاركة
                const file = new File([pdfBlob], fileName, { type: 'application/pdf' });

                const messageText = `
*التوجيه الفني للفيزياء - منطقة الأحمدي*
*تقرير زيارة فنية موجز* 📋
------------------------------
*اسم المعلم:* ${formData.teacherName}
*المدرسة:* ${formData.school}
*التقييم المبدئي:* *${formData.evaluation}*
------------------------------
📌 *تجدون التقرير التفصيلي (PDF) مرفقاً.*
                `.trim();

                // 3. التحقق مما إذا كان الجهاز يدعم المشاركة الأصلية (للآيباد والهواتف)
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        // سيفتح نافذة المشاركة بالجهاز، اختر منها الواتساب وسيتم إرفاق الـ PDF والرسالة فوراً!
                        await navigator.share({
                            files: [file],
                            title: 'تقرير زيارة',
                            text: messageText
                        });
                    } catch (shareError) {
                        // المستخدم ألغى المشاركة أو حدث خطأ، نعود لخطة تنزيل الملف كخطة بديلة
                        console.log("تم إلغاء المشاركة أو غير مدعومة، التحويل للوضع العادي.");
                        if (phoneNumber) downloadAndOpenWa(pdfBlob, fileName, phoneNumber, messageText);
                    }
                } else {
                    // جهاز كمبيوتر أو متصفح لا يدعم المشاركة المباشرة:
                    // سنقوم بتنزيل الملف وفتح رابط الواتساب ليقوم المستخدم بإرفاقه.
                    if (phoneNumber) {
                        downloadAndOpenWa(pdfBlob, fileName, phoneNumber, messageText);
                    } else {
                         alert(`متصفحك لا يدعم المشاركة التلقائية للملفات، يرجى إدخال رقم الهاتف لاستخدام واتساب ويب.`);
                    }
                }

            } catch (err) {
                console.error("Error generating PDF:", err);
                alert("حدث خطأ أثناء محاولة إنشاء التقرير.");
            } finally {
                document.body.removeChild(clone);
                setIsGenerating(false);
            }
          };

          return (
            <div className="p-8 animate-fade-in max-w-5xl mx-auto relative">
              
              <div className="bg-white p-8 rounded-3xl shadow-lg border border-gray-100 relative z-10">
                <div className="text-center border-b border-gray-100 pb-6 mb-8">
                  <h2 className="text-3xl font-extrabold text-emerald-900 mb-2">نموذج المتابعة والزيارة الفنية</h2>
                  <p className="text-gray-500">خاص بموجهي الفيزياء - منطقة الأحمدي التعليمية</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                  
                  {/* بحث المعلم */}
                  <div className="relative col-span-1 md:col-span-2">
                    <label className="block text-sm font-bold text-gray-700 mb-2">اسم المعلم (بحث بالاسم أو الرقم المدني)</label>
                    <input
                      type="text"
                      className="w-full p-4 border-2 border-gray-200 rounded-xl focus:ring-0 focus:border-emerald-500 transition-colors text-lg"
                      placeholder="ابدأ بكتابة اسم المعلم هنا..."
                      value={searchQuery}
                      onChange={(e) => {
                        setSearchQuery(e.target.value);
                        setShowDropdown(true);
                      }}
                      onFocus={() => setShowDropdown(true)}
                    />
                    {showDropdown && searchQuery && (
                      <ul className="absolute z-10 w-full mt-2 bg-white border border-gray-200 rounded-xl shadow-2xl max-h-60 overflow-y-auto">
                        {filteredTeachers.map(t => (
                          <li 
                            key={t.id} 
                            className="p-4 hover:bg-emerald-50 cursor-pointer border-b last:border-b-0 transition-colors"
                            onClick={() => handleSelectTeacher(t)}
                          >
                            <div className="font-bold text-gray-800 text-lg">{t.name}</div>
                            <div className="text-sm text-emerald-600 font-semibold mt-1">{t.school} | المدني: {t.civilId}</div>
                          </li>
                        ))}
                        {filteredTeachers.length === 0 && (
                          <li className="p-4 text-gray-500 text-center">لا يوجد معلم مطابق في قاعدة البيانات</li>
                        )}
                      </ul>
                    )}
                  </div>

                  {/* بيانات تلقائية */}
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">الرقم المدني</label>
                    <input type="text" className="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl text-gray-600 font-semibold" value={formData.civilId} readOnly placeholder="يتم التعبئة تلقائياً" />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">المدرسة</label>
                    <input type="text" className="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl text-gray-600 font-semibold" value={formData.school} readOnly placeholder="يتم التعبئة تلقائياً" />
                  </div>

                  {/* تفاصيل الزيارة */}
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">تاريخ الزيارة</label>
                    <input type="date" className="w-full p-4 border border-gray-300 rounded-xl focus:border-emerald-500 outline-none" 
                      value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">التقييم المبدئي للدرس</label>
                    <select className="w-full p-4 border border-gray-300 rounded-xl focus:border-emerald-500 outline-none font-bold"
                      value={formData.evaluation} onChange={e => setFormData({...formData, evaluation: e.target.value})}>
                      <option>امتياز</option>
                      <option>جيد جداً</option>
                      <option>جيد</option>
                      <option>مقبول</option>
                      <option>ضعيف</option>
                    </select>
                  </div>
                  
                  <div className="col-span-1 md:col-span-2">
                    <label className="block text-sm font-bold text-gray-700 mb-2">عنوان الدرس / الوحدة</label>
                    <input type="text" className="w-full p-4 border border-gray-300 rounded-xl focus:border-emerald-500 outline-none" 
                      placeholder="مثال: قانون أوم - الصف الثاني عشر"
                      value={formData.lessonTitle} onChange={e => setFormData({...formData, lessonTitle: e.target.value})} />
                  </div>

                  {/* الملاحظات */}
                  <div className="col-span-1 md:col-span-2">
                    <label className="block text-sm font-bold text-emerald-700 mb-2">أبرز الإيجابيات ونقاط القوة 🟢</label>
                    <textarea className="w-full p-4 border border-gray-300 rounded-xl h-28 focus:border-emerald-500 outline-none resize-none" 
                      placeholder="اكتب الإيجابيات التي تم رصدها أثناء الحصة..."
                      value={formData.strengths} onChange={e => setFormData({...formData, strengths: e.target.value})}></textarea>
                  </div>
                  <div className="col-span-1 md:col-span-2">
                    <label className="block text-sm font-bold text-blue-700 mb-2">التوصيات والتوجيهات الفنية 💡</label>
                    <textarea className="w-full p-4 border border-gray-300 rounded-xl h-28 focus:border-blue-500 outline-none resize-none" 
                      placeholder="اكتب التوصيات التي يجب على المعلم ورئيس القسم العمل بها..."
                      value={formData.recommendations} onChange={e => setFormData({...formData, recommendations: e.target.value})}></textarea>
                  </div>
                </div>
              </div>

              {/* قسم الإرسال عبر الواتساب */}
              <div className="mt-8 bg-gradient-to-r from-emerald-50 to-green-50 p-8 rounded-3xl border-2 border-emerald-100 shadow-sm relative z-10">
                <div className="flex items-center gap-3 mb-6">
                  <div className="bg-green-500 p-2 rounded-lg text-white">
                    <Icons.WhatsApp />
                  </div>
                  <div>
                    <h3 className="text-xl font-bold text-emerald-900">المشاركة (للآيباد والهواتف) وتوليد التقرير</h3>
                    <p className="text-sm text-emerald-700 mt-1">بالآيباد/الهاتف: سيتم الإرفاق تلقائياً عبر قائمة المشاركة. بالحاسوب: سيتم تنزيل الـ PDF لتسحبه يدوياً.</p>
                  </div>
                </div>
                
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  
                  {/* مدير المدرسة */}
                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 hover:border-green-300 transition-colors">
                    <label className="block text-sm font-bold text-gray-700 mb-3 text-center">مدير المدرسة</label>
                    <input type="tel" className="w-full p-3 border border-gray-300 rounded-xl mb-4 text-center font-bold" dir="ltr" placeholder="رقم الهاتف (للحاسوب)"
                      value={phoneNumbers.principal} onChange={e => setPhoneNumbers({...phoneNumbers, principal: e.target.value})} />
                    <button disabled={isGenerating} onClick={() => sendWhatsAppAndPDF(phoneNumbers.principal, 'مدير المدرسة')} className="w-full bg-[#25D366] hover:bg-[#128C7E] disabled:bg-gray-400 text-white py-3 rounded-xl font-bold flex justify-center items-center transition-all shadow-md">
                      {isGenerating ? <><Icons.Spinner /> جاري...</> : <>مشاركة التقرير <Icons.WhatsApp /></>}
                    </button>
                  </div>

                  {/* رئيس القسم */}
                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 hover:border-green-300 transition-colors">
                    <label className="block text-sm font-bold text-gray-700 mb-3 text-center">رئيس القسم</label>
                    <input type="tel" className="w-full p-3 border border-gray-300 rounded-xl mb-4 text-center font-bold" dir="ltr" placeholder="رقم الهاتف (للحاسوب)"
                      value={phoneNumbers.hod} onChange={e => setPhoneNumbers({...phoneNumbers, hod: e.target.value})} />
                    <button disabled={isGenerating} onClick={() => sendWhatsAppAndPDF(phoneNumbers.hod, 'رئيس القسم')} className="w-full bg-[#25D366] hover:bg-[#128C7E] disabled:bg-gray-400 text-white py-3 rounded-xl font-bold flex justify-center items-center transition-all shadow-md">
                      {isGenerating ? <><Icons.Spinner /> جاري...</> : <>مشاركة التقرير <Icons.WhatsApp /></>}
                    </button>
                  </div>

                  {/* الموجه الأول */}
                  <div className="bg-emerald-50 p-5 rounded-2xl shadow-sm border-2 border-emerald-200">
                    <label className="block text-sm font-bold text-emerald-800 mb-3 text-center">الموجه الأول: أ. طارق شهاب</label>
                    <input type="tel" className="w-full p-3 border border-emerald-300 rounded-xl mb-4 text-center font-bold bg-white" dir="ltr" placeholder="رقم الهاتف (للحاسوب)"
                      value={phoneNumbers.senior} onChange={e => setPhoneNumbers({...phoneNumbers, senior: e.target.value})} />
                    <button disabled={isGenerating} onClick={() => sendWhatsAppAndPDF(phoneNumbers.senior, 'الموجه الأول')} className="w-full bg-emerald-700 hover:bg-emerald-800 disabled:bg-gray-400 text-white py-3 rounded-xl font-bold flex justify-center items-center transition-all shadow-md">
                      {isGenerating ? <><Icons.Spinner /> جاري...</> : <>مشاركة التقرير <Icons.WhatsApp /></>}
                    </button>
                  </div>

                </div>
              </div>

              {/* قالب الـ PDF المخفي */}
              <div style={{ display: 'none' }}>
                <div id="pdf-hidden-template" className="pdf-report-container" style={{ width: '800px', padding: '40px', direction: 'rtl' }}>
                    <div style={{ textAlign: 'center', marginBottom: '30px', borderBottom: '2px solid #065f46', paddingBottom: '15px' }}>
                        <h1 style={{ fontSize: '26px', fontWeight: 'bold', color: '#065f46', margin: '0' }}>دولة الكويت - وزارة التربية</h1>
                        <h2 style={{ fontSize: '20px', fontWeight: 'bold', marginTop: '10px', color: '#333' }}>منطقة الأحمدي التعليمية</h2>
                        <h3 style={{ fontSize: '18px', marginTop: '5px', color: '#555' }}>التوجيه الفني للفيزياء</h3>
                    </div>

                    <div style={{ textAlign: 'center', margin: '20px 0 30px' }}>
                        <span style={{ fontSize: '22px', fontWeight: 'bold', backgroundColor: '#ecfdf5', padding: '10px 30px', borderRadius: '8px', border: '1px solid #a7f3d0', display: 'inline-block' }}>
                            تقرير زيارة فنية
                        </span>
                    </div>

                    <table className="pdf-table" style={{ width: '100%', borderCollapse: 'collapse', marginBottom: '20px' }}>
                        <tbody>
                            <tr>
                                <th>اسم المعلم</th>
                                <td>{formData.teacherName || 'ــــــــــــــ'}</td>
                            </tr>
                            <tr>
                                <th>الرقم المدني</th>
                                <td>{formData.civilId || 'ــــــــــــــ'}</td>
                            </tr>
                            <tr>
                                <th>المدرسة</th>
                                <td>{formData.school || 'ــــــــــــــ'}</td>
                            </tr>
                            <tr>
                                <th>تاريخ الزيارة</th>
                                <td dir="ltr" style={{ textAlign: 'right' }}>{formData.date}</td>
                            </tr>
                            <tr>
                                <th>عنوان الدرس / الوحدة</th>
                                <td>{formData.lessonTitle || 'ــــــــــــــ'}</td>
                            </tr>
                            <tr>
                                <th>التقييم المبدئي للدرس</th>
                                <td style={{ fontWeight: 'bold' }}>{formData.evaluation}</td>
                            </tr>
                        </tbody>
                    </table>

                    <div style={{ marginBottom: '20px' }}>
                        <h3 style={{ fontSize: '18px', fontWeight: 'bold', color: '#065f46', borderBottom: '1px solid #cbd5e1', paddingBottom: '5px' }}>أبرز الإيجابيات ونقاط القوة:</h3>
                        <p style={{ minHeight: '80px', padding: '10px', backgroundColor: '#f8fafc', border: '1px solid #e2e8f0', whiteSpace: 'pre-wrap' }}>
                            {formData.strengths || 'لم يتم تدوين ملاحظات.'}
                        </p>
                    </div>

                    <div style={{ marginBottom: '30px' }}>
                        <h3 style={{ fontSize: '18px', fontWeight: 'bold', color: '#065f46', borderBottom: '1px solid #cbd5e1', paddingBottom: '5px' }}>التوصيات والتوجيهات الفنية:</h3>
                        <p style={{ minHeight: '80px', padding: '10px', backgroundColor: '#f8fafc', border: '1px solid #e2e8f0', whiteSpace: 'pre-wrap' }}>
                            {formData.recommendations || 'لا توجد توصيات إضافية.'}
                        </p>
                    </div>

                    <div style={{ marginTop: '50px', display: 'flex', justifyContent: 'space-between', padding: '0 20px' }}>
                        <div style={{ textAlign: 'center' }}>
                            <p style={{ fontWeight: 'bold', marginBottom: '30px' }}>الموجه الفني للفيزياء</p>
                            <p>.......................................</p>
                        </div>
                        <div style={{ textAlign: 'center' }}>
                            <p style={{ fontWeight: 'bold', marginBottom: '30px' }}>يعتمد ،،، الموجه الفني الأول</p>
                            <p>أ. طارق شهاب</p>
                        </div>
                    </div>
                </div>
              </div>

            </div>
          );
        }

        // ==========================================
        // Teachers View (سجل المعلمين)
        // ==========================================
        function TeachersView({ teachers, setTeachers }) {
          const [confirmDeleteId, setConfirmDeleteId] = useState(null);
          const [showAddModal, setShowAddModal] = useState(false);
          const [newTeacher, setNewTeacher] = useState({ name: '', civilId: '', school: '' });

          const handleDelete = (id) => {
            // حذف المعلم وتحديث القاعدة الرئيسية
            setTeachers(teachers.filter(t => t.id !== id));
            setConfirmDeleteId(null);
          };

          // دالة جديدة لاستعادة القائمة الأساسية
          const handleRestoreDefault = () => {
            if(window.confirm('هل أنت متأكد من استعادة قائمة المعلمين الأصلية (200 معلم)؟ سيتم مسح أي معلمين جدد أضفتهم.')) {
               setTeachers(initialTeachersDB);
            }
          };

          const handleAddSubmit = (e) => {
            e.preventDefault();
            if (!newTeacher.name || !newTeacher.civilId || !newTeacher.school) {
                alert('الرجاء تعبئة جميع الحقول');
                return;
            }
            // إنشاء معرّف جديد للمعلم
            const newId = teachers.length > 0 ? Math.max(...teachers.map(t => t.id)) + 1 : 1;
            const addedTeacher = { id: newId, ...newTeacher };
            
            // إضافة المعلم في أعلى القائمة وتحديث القاعدة الرئيسية
            setTeachers([addedTeacher, ...teachers]); 
            
            // إغلاق النافذة وتفريغ الحقول
            setShowAddModal(false);
            setNewTeacher({ name: '', civilId: '', school: '' });
          };

          return (
            <div className="p-8 animate-fade-in relative">
              <div className="bg-white p-8 rounded-3xl shadow-lg border border-gray-100">
                <div className="flex justify-between items-center mb-6 border-b pb-4">
                  <h2 className="text-2xl font-bold text-emerald-900">سجل معلمي الفيزياء ({teachers.length} معلم)</h2>
                  <div className="flex gap-3">
                    <button 
                      onClick={handleRestoreDefault}
                      className="bg-gray-100 text-gray-600 px-4 py-2 rounded-xl font-bold text-sm hover:bg-gray-200 transition-colors"
                    >
                      استعادة القائمة الأصلية
                    </button>
                    <button 
                      onClick={() => setShowAddModal(true)}
                      className="bg-emerald-100 text-emerald-800 px-4 py-2 rounded-xl font-bold text-sm hover:bg-emerald-200 transition-colors"
                    >
                      إضافة معلم جديد +
                    </button>
                  </div>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-right">
                    <thead className="bg-emerald-50 text-emerald-800">
                      <tr>
                        <th className="p-4 rounded-tr-xl border-b border-emerald-100">م</th>
                        <th className="p-4 border-b border-emerald-100">اسم المعلم</th>
                        <th className="p-4 border-b border-emerald-100">الرقم المدني</th>
                        <th className="p-4 border-b border-emerald-100">المدرسة</th>
                        <th className="p-4 rounded-tl-xl border-b border-emerald-100">الإجراءات</th>
                      </tr>
                    </thead>
                    <tbody>
                      {teachers.map((t, index) => (
                        <tr key={t.id} className="border-b border-gray-100 hover:bg-emerald-50/50 transition-colors">
                          <td className="p-4 text-gray-500 font-semibold">{index + 1}</td>
                          <td className="p-4 font-bold text-gray-800">{t.name}</td>
                          <td className="p-4 text-gray-500 font-mono">{t.civilId}</td>
                          <td className="p-4 text-emerald-700 font-semibold">{t.school}</td>
                          <td className="p-4 flex gap-4 items-center">
                            <button className="text-sm text-blue-600 hover:text-blue-800 font-bold">سجل الزيارات</button>
                            {confirmDeleteId === t.id ? (
                              <div className="flex gap-2 items-center bg-red-50 px-2 py-1 rounded-lg border border-red-200">
                                <span className="text-xs text-red-700 font-bold">متأكد؟</span>
                                <button onClick={() => handleDelete(t.id)} className="text-sm text-white bg-red-500 px-2 py-1 rounded hover:bg-red-600 font-bold">نعم</button>
                                <button onClick={() => setConfirmDeleteId(null)} className="text-sm text-gray-600 hover:text-gray-900 bg-gray-200 px-2 py-1 rounded font-bold">لا</button>
                              </div>
                            ) : (
                              <button 
                                onClick={() => setConfirmDeleteId(t.id)}
                                className="text-sm text-red-500 hover:text-red-700 flex items-center font-bold"
                              >
                                <Icons.Trash /> حذف
                              </button>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* النافذة المنبثقة لإضافة معلم جديد */}
              {showAddModal && (
                <div className="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                  <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8 animate-fade-in border-2 border-emerald-100">
                    <h3 className="text-2xl font-extrabold text-emerald-900 mb-6 border-b border-gray-100 pb-4">إضافة معلم جديد</h3>
                    <form onSubmit={handleAddSubmit} className="space-y-5">
                      <div>
                        <label className="block text-sm font-bold text-gray-700 mb-2">اسم المعلم رباعي</label>
                        <input type="text" required className="w-full p-4 border border-gray-300 rounded-xl focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all" placeholder="مثال: أحمد محمد علي" value={newTeacher.name} onChange={e => setNewTeacher({...newTeacher, name: e.target.value})} />
                      </div>
                      <div>
                        <label className="block text-sm font-bold text-gray-700 mb-2">الرقم المدني</label>
                        <input type="text" required className="w-full p-4 border border-gray-300 rounded-xl focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all font-mono" placeholder="12 أرقام" dir="ltr" value={newTeacher.civilId} onChange={e => setNewTeacher({...newTeacher, civilId: e.target.value})} />
                      </div>
                      <div>
                        <label className="block text-sm font-bold text-gray-700 mb-2">المدرسة</label>
                        <input type="text" required className="w-full p-4 border border-gray-300 rounded-xl focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all" placeholder="اسم المدرسة" value={newTeacher.school} onChange={e => setNewTeacher({...newTeacher, school: e.target.value})} />
                      </div>
                      <div className="flex gap-4 mt-8 pt-6 border-t border-gray-100">
                        <button type="submit" className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-bold transition-all shadow-md hover:shadow-lg">حفظ وإضافة</button>
                        <button type="button" onClick={() => setShowAddModal(false)} className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 py-3.5 rounded-xl font-bold transition-all">إلغاء</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // ==========================================
        // Analytics View (تحليل النتائج)
        // ==========================================
        function AnalyticsView() {
          const schoolsData = [
            { name: 'أيوب حسين الأيوب', passRate: 85, failRate: 15 },
            { name: 'عيسى عبد الله الهولي', passRate: 92, failRate: 8 },
            { name: 'هشام بن العاص', passRate: 58, failRate: 42 },
            { name: 'الكندي', passRate: 88, failRate: 12 },
          ];

          return (
            <div className="p-8 animate-fade-in">
              <h2 className="text-3xl font-bold text-gray-800 mb-8 border-b pb-4">تحليل نتائج الطلبة - مادة الفيزياء</h2>

              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div className="bg-white p-8 rounded-3xl shadow-lg border border-gray-100">
                  <h3 className="text-xl font-bold text-emerald-900 mb-6">نسب النجاح والرسوب حسب المدرسة</h3>
                  <div className="space-y-6">
                    {schoolsData.map((school, i) => (
                      <div key={i}>
                        <div className="flex justify-between text-sm mb-2">
                          <span className="font-bold text-gray-700">{school.name}</span>
                          <span className="text-emerald-600 font-bold">نجاح: {school.passRate}%</span>
                        </div>
                        <div className="w-full bg-red-100 rounded-full h-4 flex overflow-hidden">
                          <div className="bg-emerald-500 h-4 transition-all duration-1000" style={{ width: `${school.passRate}%` }}></div>
                          <div className="bg-red-500 h-4 transition-all duration-1000" style={{ width: `${school.failRate}%` }}></div>
                        </div>
                      </div>
                    ))}
                  </div>
                  <div className="mt-8 flex gap-6 text-sm justify-center font-bold text-gray-600">
                    <span className="flex items-center gap-2"><span className="w-4 h-4 bg-emerald-500 rounded-full"></span> نسبة النجاح</span>
                    <span className="flex items-center gap-2"><span className="w-4 h-4 bg-red-500 rounded-full"></span> نسبة الرسوب</span>
                  </div>
                </div>

                <div className="bg-gradient-to-br from-red-50 to-orange-50 border-r-4 border-red-500 p-8 rounded-3xl shadow-lg">
                  <h3 className="text-xl font-bold text-red-800 mb-6 flex items-center gap-2">
                    <Icons.Chart /> تنبيهات وخطط علاجية مقترحة
                  </h3>
                  <ul className="space-y-4">
                    <li className="bg-white p-5 rounded-2xl shadow-sm border border-red-100 text-gray-700">
                      <strong className="text-red-700 block mb-1">مدرسة هشام بن العاص:</strong> انخفاض نسبة النجاح عن المعدل الطبيعي (58%). يوصى بزيارة فنية مكثفة ومراجعة خطط رئيس القسم وإعداد خطة علاجية عاجلة.
                    </li>
                    <li className="bg-white p-5 rounded-2xl shadow-sm border border-orange-100 text-gray-700">
                      <strong className="text-orange-700 block mb-1">تحليل الوحدات:</strong> لوحظ تدني عام في درجات وحدة "الكهرباء والمغناطيسية" على مستوى المنطقة. يوصى بتنظيم ورشة عمل فنية لمعلمي المنطقة.
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
